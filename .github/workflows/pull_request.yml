name: Verify and build
run-name: Verify and build ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [ master ]

#to cancel currently running workflow for same pr if new changes pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dump_contexts_to_log:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"
      - name: Dump steps context
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: echo "$STEPS_CONTEXT"
      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"
      - name: Dump strategy context
        env:
          STRATEGY_CONTEXT: ${{ toJson(strategy) }}
        run: echo "$STRATEGY_CONTEXT"
      - name: Dump matrix context
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        run: echo "$MATRIX_CONTEXT"

  verifyAndBuild:
    name: Verify and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Run Debug Lint
        if: ${{ always() }}
        run: ./gradlew lintDebug

      - name: Upload Lint Reports
        id: uploadLintReports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*'

      - name: Run detekt
        if: ${{ always() }}
        run: ./gradlew detekt

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: reports/detekt.sarif

      - name: Run unit tests
        if: ${{ always() }}
        run: ./gradlew testDebug

      - name: Upload Test Reports
        id: uploadTestReports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > $KEYSTORE_FILE

      - name: Build Release apk
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload apk
        id: uploadApk
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk

      - name: Log artifacts url
        if: ${{ always() }}
        run: |
          echo "lint reports URL is ${{ steps.uploadLintReports.outputs.artifact-url }}"
          echo "test reports URL is ${{ steps.uploadTestReports.outputs.artifact-url }}"
          echo "apk URL is ${{ steps.uploadApk.outputs.artifact-url }}"

      - name: Comment artifacts url
        if: ${{ always() }}
        run: |
          gh pr comment ${{ github.event.number }} --body "Hi from GitHub CLI"

#          echo "lint reports URL is ${{ steps.uploadLintReports.outputs.artifact-url }}"
#          echo "test reports URL is ${{ steps.uploadTestReports.outputs.artifact-url }}"
